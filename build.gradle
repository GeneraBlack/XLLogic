plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    libraries
    implementation.extendsFrom libraries
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven { url = uri('https://maven.neoforged.net/releases') }
    mavenCentral()
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        jvmArguments.addAll('-XX:+UnlockExperimentalVMOptions', '-XX:+EnableJVMCI')
        systemProperty 'polyglotimpl.DisableMultiReleaseCheck', 'true'
        systemProperty 'org.graalvm.python.resources.exclude', '.*\\.(exe|bat|cmd|ps1|sh|csh|fish)$'
        modSource project.sourceSets.main
        dependencies {
            runtime project.configurations.libraries
        }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'xllogic.hostCallDiagnosticsThresholdMillis', '0'
        systemProperty 'xllogic.hostCallDiagnosticsTopEntries', '8'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    libraries "org.graalvm.polyglot:polyglot:${graalpy_version}"
    libraries "org.graalvm.polyglot:python:${graalpy_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('shadowJar').configure {
    archiveClassifier = ''
    configurations = [project.configurations.libraries]
    mergeServiceFiles()
    zip64 true
    manifest {
        attributes(
            'Multi-Release': 'true'
        )
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude '**/*.exe'
    exclude '**/*.bat'
    exclude '**/*.cmd'
    exclude '**/*.ps1'
    exclude '**/*.sh'
    exclude '**/*.csh'
    exclude '**/*.fish'

    doLast {
        def jarFile = archiveFile.get().asFile
        def uri = java.net.URI.create("jar:" + jarFile.toURI())
        def env = [create: 'false']
        java.nio.file.FileSystems.newFileSystem(uri, env).withCloseable { fs ->
            def resDir = fs.getPath('/META-INF/resources')
            if (java.nio.file.Files.exists(resDir)) {
                java.nio.file.Files.walk(resDir).each { path ->
                    def name = path.toString()
                    if (name.endsWith('.files') || name.endsWith('/files')) {
                        def lines = java.nio.file.Files.readAllLines(path, java.nio.charset.StandardCharsets.UTF_8)
                        def filtered = lines.findAll { line ->
                            !(line =~ /\.(exe|bat|cmd|ps1|sh|csh|fish)\b/)
                        }
                        if (filtered.size() != lines.size()) {
                            java.nio.file.Files.write(path, filtered, java.nio.charset.StandardCharsets.UTF_8)
                            logger.lifecycle("Filtered {} excluded entries from {}", lines.size() - filtered.size(), name)
                        }
                    }
                }
            }
        }
    }
}

tasks.named('jar').configure {
    enabled = false
}

tasks.named('assemble').configure {
    dependsOn tasks.named('shadowJar')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('shadowJar')
        }
    }

    repositories {
        maven {
            url = uri("file://${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
